<h2 mat-dialog-title style="border-bottom: 1px solid #eee; color: #fff; text-align: center; background: #005ba3;">Change Employment Status</h2>
<mat-dialog-content class="mat-typography" style="height: calc(100% - 130px);">
    <div class="form-group">
        <div class="row">
            <form [formGroup]="myForm" style="width: 100%;">
                <mat-form-field style="width: 100%;">
                    <mat-label>Select an option</mat-label>
                    <mat-select formControlName="selectedOption">
                        <mat-option *ngFor="let option of options" [value]="option.value">
                            {{option.name}}
                        </mat-option>
                    </mat-select>
                </mat-form-field>
            </form>
        </div>
    </div>
</mat-dialog-content>
<mat-dialog-actions align="end">
  
    <button mat-button mat-dialog-close  class="btn btn-primary btn-block btn-m" style="margin-right: 15px;">Cancel</button>
  <button type="submit" (click)="submit()"  class="btn btn-primary btn-block btn-m">
    Submit
    </button>
</mat-dialog-actions>
